# Local quality gate. Install once with: pre-commit install
# Early feedback only: this hook is bypassable with --no-verify, so CI
# (.github/workflows/ci.yml) is the authority and runs the full gate.
#
# Hooks that run a binary (terraform, tflint, trivy, gitleaks, actionlint,
# ruff) use the version installed on PATH or in .venv, which `make tools`
# checks against .tool-versions and requirements-dev.txt. No hook pins its
# own copy: two copies of one tool were how the hook and CI drifted (debt #54).
#
# Pin revisions with: pre-commit autoupdate

repos:
  # ---------------------------------------------------------------- basics
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch

  # ------------------------------------------------------------- terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt

      - id: terraform_validate
        args:
          - --init-args=-backend=false
          - --hook-config=--parallelism-limit=1

      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL

  # ------------------------------------------------- pinned local binaries
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      - id: ruff
        name: ruff (fix + format)
        entry: make py-fix
        language: system
        types: [python]
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
