# CI — the merge gate for pyrosense-infrastructure.
#
# Every job calls the same Makefile targets used locally (`make check`), so
# the gate is defined once. The job names are the required status checks of
# the protected-branches ruleset (docs/github/ruleset-protected-branches.json):
# renaming a job silently drops it from the gate until the ruleset is updated.
#
# No `paths:` filter, on purpose: a required check whose workflow does not run
# never reports, and a filtered-out change merges unchecked (ADR-0022).
#
# Third-party actions are pinned to a full commit SHA; binaries are pinned in
# .tool-versions and verified against scripts/tooling/checksums.txt.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Default for every job; a job lists only what it adds.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant. Safe to cancel:
# no job here writes outside its runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credential: false

      - name: Set up Python (version from .tool-versions)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .tool-versions
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint, type-check and test with the coverage floor
        run: make py-lint py-type py-test

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-terraform resolves an empty or malformed version to the latest
      # release, so a missing pin would install a different Terraform and
      # stay green. Only an exact X.Y.Z passes.
      - name: Read the pinned Terraform version
        id: pins
        run: |
          version="$(awk '$1 == "terraform" { print $2 }' .tool-versions)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.tool-versions::terraform must be pinned to an exact X.Y.Z version (found: '${version}')"
            exit 1
          fi
          echo "terraform=${version}" >> "$GITHUB_OUTPUT"

      # The wrapper rewrites stdout and the exit status into step outputs;
      # make needs the plain binary and its real exit code.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.pins.outputs.terraform }}
          terraform_wrapper: false

      - name: Install TFLint
        run: scripts/tooling/install-tool.sh tflint

      # tflint --init downloads the ruleset from GitHub releases; without a
      # token it shares the anonymous API rate limit of the runner's IP.
      - name: Format, validate and lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make fmt-check validate lint

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Full history: `make secrets` scans every commit, and a shallow clone
      # would hide a secret added and then deleted inside the same PR.
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Trivy and gitleaks
        run: |
          scripts/tooling/install-tool.sh trivy
          scripts/tooling/install-tool.sh gitleaks

      # demo.tfvars is gitignored (PII); the committed template carries the
      # same variable shapes, which is what the scanner evaluates.
      - name: Scan for misconfigurations and secrets
        run: make sec TFVARS=demo.tfvars.example

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: scripts/tooling/install-tool.sh actionlint

      - name: Forbidden files and workflow lint
        run: make guard ci-lint
