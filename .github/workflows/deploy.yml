# Manual delivery to demo (ADR-0025): continuous delivery, not continuous
# deployment. Nothing here runs on a merge. A person dispatches it from main,
# reads the plan, and approves the environment; only then does a job get
# credentials that can write.
#
#   preflight  no credentials   checks the inputs and the branch
#   plan       plan role        plans, enforces the operation's policy, writes
#                               the summary the reviewer reads before approving
#   deliver    apply role       waits for the approval of environment demo,
#              (environment)    plans again, refuses to apply unless that plan
#                               matches the approved one, applies, verifies
name: deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "apply creates or updates demo; destroy removes all of it"
        type: choice
        options:
          - apply
          - destroy
        required: true
      confirm:
        description: "Type the operation again to confirm"
        type: string
        required: true

# Every job declares what it needs; nothing is granted by default.
permissions: {}

# One delivery at a time. Never cancel a running one: it holds the state lock
# and may be halfway through an apply. A newer dispatch replaces a pending one
# (queue: single, the default): the latest intent wins. Pull request plans do
# not share this group; the S3 state lock serialises them against a delivery
# (-lock-timeout below), so an approval waiting for hours blocks no review.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  AWS_REGION: us-east-1
  OPERATION: ${{ inputs.operation }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # Fails before anyone is asked to approve. The environment would reject
      # another branch too, but only after the run has queued for approval.
      - name: Check branch and confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::demo is delivered from main only (this run: $REF)"
            exit 1
          fi
          if [[ "$CONFIRM" != "$OPERATION" ]]; then
            echo "::error::confirm must repeat the operation exactly ($OPERATION)"
            exit 1
          fi
          echo "operation: $OPERATION"

  plan:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      fingerprint: ${{ steps.guard.outputs.fingerprint }}
      changes: ${{ steps.guard.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(scripts/tooling/tool-version.sh terraform)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      # The read-only role. It trusts this job only on main and only from this
      # file (job_workflow_ref, bootstrap/ci-identity).
      # Evidence: the claims AWS compares with the trust policy, job_workflow_ref
      # included. The token itself is masked.
      - name: Show the claims AWS will check
        run: scripts/ci/oidc-probe.sh claims

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: deploy-plan-${{ github.run_id }}
          role-duration-seconds: 1800
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Build the sensitive input layer
        env:
          OPS_RECIPIENTS: ${{ secrets.DEMO_OPS_RECIPIENTS }}
          FIRE_ALERT_RECIPIENTS: ${{ secrets.DEMO_FIRE_ALERT_RECIPIENTS }}
          FLEET_CLIENT_CSR: ${{ vars.DEMO_IOT_FLEET_CLIENT_CSR }}
        run: scripts/ci/sensitive-tfvars.sh "$RUNNER_TEMP"

      - name: terraform init
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -no-color -lockfile=readonly \
            -backend-config=config/backend.hcl.example \
            -backend-config="bucket=pyrosense-tfstate-${account_id}" \
            > "$RUNNER_TEMP/init.log" 2>&1 \
            || { scripts/ci/redact.sh < "$RUNNER_TEMP/init.log" | tail -n 40; exit 1; }

      # Before a destroy: did anyone change demo outside Terraform? Reported,
      # not blocking: refusing to destroy would leave a billed environment up.
      - name: Drift check before destroy
        if: inputs.operation == 'destroy'
        run: |
          rc=0
          terraform plan -refresh-only -input=false -no-color -lock-timeout=10m \
            -var-file=demo.tfvars.example -var-file="$RUNNER_TEMP/sensitive.tfvars.json" \
            -out="$RUNNER_TEMP/drift.tfplan" > "$RUNNER_TEMP/drift.log" 2>&1 || rc=$?
          if [[ $rc -ne 0 ]]; then scripts/ci/redact.sh < "$RUNNER_TEMP/drift.log" | tail -n 40; exit 1; fi
          terraform show -json "$RUNNER_TEMP/drift.tfplan" > "$RUNNER_TEMP/drift.json"
          scripts/ci/plan_guard.py --operation drift "$RUNNER_TEMP/drift.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: terraform plan
        run: |
          args=(-input=false -no-color -lock-timeout=10m -detailed-exitcode
                -var-file=demo.tfvars.example -var-file="$RUNNER_TEMP/sensitive.tfvars.json"
                -out="$RUNNER_TEMP/tfplan")
          if [[ "$OPERATION" == "destroy" ]]; then args+=(-destroy); fi
          rc=0
          terraform plan "${args[@]}" > "$RUNNER_TEMP/plan.log" 2>&1 || rc=$?
          if [[ $rc -ne 0 && $rc -ne 2 ]]; then
            scripts/ci/redact.sh < "$RUNNER_TEMP/plan.log" | tail -n 40
            exit 1
          fi
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"

      - name: Summary for the reviewer
        run: |
          {
            echo "### Delivery to demo: \`$OPERATION\`"
            echo "Approve the \`demo\` environment only if this is what you intend."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          scripts/ci/plan-summary.sh "$RUNNER_TEMP/plan.json" demo >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce the operation's policy
        id: guard
        run: |
          scripts/ci/plan_guard.py --operation "$OPERATION" "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          grep '^changes=' "$GITHUB_OUTPUT" | tail -n 1

      - name: Remove plan files
        if: always()
        run: rm -f "$RUNNER_TEMP"/{tfplan,plan.json,plan.log,init.log,drift.tfplan,drift.json,drift.log,sensitive.tfvars.json,fleet-client.csr}

  deliver:
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    # Protection rules run before this job starts: required reviewer, main
    # only, no admin bypass. Until the approval there is no runner, no token
    # and no AWS_APPLY_ROLE_ARN.
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      APPROVED_FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
      # Probe resources are never meant to exist; see the cleanup step.
      PROBE_NAME: oidc-probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned Terraform version
        id: tf
        run: echo "version=$(scripts/tooling/tool-version.sh terraform)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      # 3600 s is the role's ceiling. A cycle takes minutes; a failed apply is
      # resumed by dispatching again, never by a longer session.
      # Evidence: the claims AWS compares with the trust policy, job_workflow_ref
      # included. The token itself is masked.
      - name: Show the claims AWS will check
        run: scripts/ci/oidc-probe.sh claims

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: deploy-${{ inputs.operation }}-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Every delivery re-proves the role cannot escalate before it writes
      # anything (moved here from oidc-probe.yml: the apply role now trusts
      # only this file).
      # The escalation test: a role with no boundary could be given any policy.
      - name: Refused - create a role without the workload boundary
        run: >-
          scripts/ci/oidc-probe.sh expect-denied "apply role creates an unbounded role" --
          aws iam create-role --role-name "pyrosense-demo-${PROBE_NAME}"
          --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}'

      - name: Refused - create a resource of another environment
        run: >-
          scripts/ci/oidc-probe.sh expect-denied "apply role creates a prod queue" --
          aws sqs create-queue --queue-name "pyrosense-prod-${PROBE_NAME}"

      - name: Refused - change the pipeline's own role
        run: >-
          scripts/ci/oidc-probe.sh expect-denied "apply role tags its own role" --
          aws iam tag-role --role-name pyrosense-ci-apply-demo --tags Key=probe,Value=denied

      - name: Build the sensitive input layer
        env:
          OPS_RECIPIENTS: ${{ secrets.DEMO_OPS_RECIPIENTS }}
          FIRE_ALERT_RECIPIENTS: ${{ secrets.DEMO_FIRE_ALERT_RECIPIENTS }}
          FLEET_CLIENT_CSR: ${{ vars.DEMO_IOT_FLEET_CLIENT_CSR }}
        run: scripts/ci/sensitive-tfvars.sh "$RUNNER_TEMP"

      - name: terraform init
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -no-color -lockfile=readonly \
            -backend-config=config/backend.hcl.example \
            -backend-config="bucket=pyrosense-tfstate-${account_id}" \
            > "$RUNNER_TEMP/init.log" 2>&1 \
            || { scripts/ci/redact.sh < "$RUNNER_TEMP/init.log" | tail -n 40; exit 1; }

      # The plan file never travels between jobs: it holds the recipients in
      # clear text, and artifacts of a public repository are downloadable by
      # anyone signed in. This job plans again and checks the fingerprint.
      - name: terraform plan (again, with the apply role)
        run: |
          args=(-input=false -no-color -lock-timeout=10m
                -var-file=demo.tfvars.example -var-file="$RUNNER_TEMP/sensitive.tfvars.json"
                -out="$RUNNER_TEMP/tfplan")
          if [[ "$OPERATION" == "destroy" ]]; then args+=(-destroy); fi
          terraform plan "${args[@]}" > "$RUNNER_TEMP/plan.log" 2>&1 \
            || { scripts/ci/redact.sh < "$RUNNER_TEMP/plan.log" | tail -n 40; exit 1; }
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"

      - name: Apply only what was approved
        run: |
          scripts/ci/plan_guard.py --operation "$OPERATION" \
            --expect "$APPROVED_FINGERPRINT" "$RUNNER_TEMP/plan.json"
          echo "plan matches the approved one"

      - name: terraform apply
        run: |
          terraform apply -input=false -no-color -lock-timeout=10m "$RUNNER_TEMP/tfplan" \
            > "$RUNNER_TEMP/apply.log" 2>&1 \
            || { scripts/ci/redact.sh < "$RUNNER_TEMP/apply.log" | tail -n 60; exit 1; }
          grep -E '^(Apply|Destroy) complete!' "$RUNNER_TEMP/apply.log" | tee -a "$GITHUB_STEP_SUMMARY"

      # A second plan right after an apply must be empty. Anything else is a
      # perpetual diff or a resource changed behind Terraform's back.
      - name: Converged (apply)
        if: inputs.operation == 'apply'
        run: |
          rc=0
          terraform plan -input=false -no-color -detailed-exitcode -lock-timeout=10m \
            -var-file=demo.tfvars.example -var-file="$RUNNER_TEMP/sensitive.tfvars.json" \
            -out="$RUNNER_TEMP/converge.tfplan" > "$RUNNER_TEMP/converge.log" 2>&1 || rc=$?
          if [[ $rc -eq 0 ]]; then echo "converged: no changes after apply"; exit 0; fi
          if [[ $rc -eq 2 ]]; then
            terraform show -json "$RUNNER_TEMP/converge.tfplan" > "$RUNNER_TEMP/converge.json"
            scripts/ci/plan-summary.sh "$RUNNER_TEMP/converge.json" demo
            echo "::error::the configuration did not converge after apply"
            exit 1
          fi
          scripts/ci/redact.sh < "$RUNNER_TEMP/converge.log" | tail -n 40
          exit 1

      - name: Smoke test (apply)
        if: inputs.operation == 'apply'
        run: scripts/ci/smoke-demo.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Nothing left behind (destroy)
        if: inputs.operation == 'destroy'
        run: |
          left="$(terraform state list | wc -l)"
          echo "resources left in state: $left" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$left" -eq 0 ]]

      - name: Clean up anything AWS should have refused
        if: failure()
        run: |
          aws iam delete-role --role-name "pyrosense-demo-${PROBE_NAME}" 2>/dev/null || true
          aws sqs delete-queue --queue-url "$(aws sqs get-queue-url --queue-name "pyrosense-prod-${PROBE_NAME}" --query QueueUrl --output text 2>/dev/null)" 2>/dev/null || true
          aws iam untag-role --role-name pyrosense-ci-apply-demo --tag-keys probe 2>/dev/null || true

      - name: Remove plan files
        if: always()
        run: rm -f "$RUNNER_TEMP"/{tfplan,plan.json,plan.log,init.log,apply.log,converge.tfplan,converge.json,converge.log,sensitive.tfvars.json,fleet-client.csr}
